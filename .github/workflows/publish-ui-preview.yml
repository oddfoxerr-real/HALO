name: Publish HALO v0.20.23 UI Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: halo-ui-preview-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout HALO
        uses: actions/checkout@v4

      - name: Verify matching tested source and retrieve build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_RUN=41894030604
          EXPECTED_SHA=51f524946ee189ef3b184dcec893ecaba666c7db
          BUILD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.head_sha')"
          BUILD_RESULT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.conclusion')"
          GPU_RUN=41894030664
          GPU_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GPU_RUN" --jq '.head_sha')"
          GPU_RESULT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GPU_RUN" --jq '.conclusion')"
          if [[ "$GPU_SHA" != "$EXPECTED_SHA" || "$GPU_RESULT" != "success" ]]; then
            echo "::error::GPU smoke test must pass for the same source commit."
            exit 1
          fi
          if [[ "$BUILD_SHA" != "$EXPECTED_SHA" || "$BUILD_RESULT" != "success" ]]; then
            echo "::error::The preview must come from the tested, successful UI build."
            exit 1
          fi
          mkdir -p preview-apk
          gh run download "$BUILD_RUN" -n HALO-debug-apk -D preview-apk
          test -s preview-apk/app-debug.apk
          test -s preview-apk/SHA256SUMS.txt
          EXPECTED_DIGEST="$(awk 'NR==1 {print $1}' preview-apk/SHA256SUMS.txt)"
          ACTUAL_DIGEST="$(sha256sum preview-apk/app-debug.apk | awk '{print $1}')"
          if [[ "$EXPECTED_DIGEST" != "$ACTUAL_DIGEST" ]]; then
            echo "::error::Debug APK SHA-256 does not match the verified build artifact."
            exit 1
          fi
          mv preview-apk/app-debug.apk HALO-v0.20.23-preview.1-debug.apk
          sha256sum HALO-v0.20.23-preview.1-debug.apk > SHA256SUMS.txt
          echo "Verified debug APK: $ACTUAL_DIGEST"

      - name: Publish labelled preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v0.20.23-preview.1"
          EXPECTED_SHA=51f524946ee189ef3b184dcec893ecaba666c7db
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Preview already published; not overwriting an installable binary."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            HALO-v0.20.23-preview.1-debug.apk SHA256SUMS.txt \
            --target "$EXPECTED_SHA" \
            --title "HALO v0.20.23 — Clean UI Debug Preview" \
            --prerelease \
            --notes "Android preview APK built and tested from commit 51f52494. Three streamlined bottom tabs (Home, Music, Alerts), Settings moved to the top bar, compact music preview, optional diagnostic details, collapsed per-app rules and advanced color/motion/camera settings. The same 59 edge lighting designs and notification/music rendering engines remain available. Debug APK compiled with unit tests and GPU shader smoke checks passed.

          **Installation note:** This APK is debug-signed, not signed with HALO's permanent production key. Existing debug builds may have a different signing certificate; Android may require uninstalling the previous build before installation. Installing this preview does not activate signature-stable automatic updates. The separate production release remains blocked until the secure CI signing secret is configured.

          Source build: https://github.com/oddfoxerr-real/HALO/actions/runs/41894030604"
