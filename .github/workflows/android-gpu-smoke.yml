name: Android GPU shader smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-gpu-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halo-gpu-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agsl-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile AGSL on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
