name: Release HALO Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify and name APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "HALO-${GITHUB_REF_NAME}-debug.apk"
          sha256sum "HALO-${GITHUB_REF_NAME}-debug.apk" > SHA256SUMS.txt
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: HALO-release-build
          path: |
            HALO-*-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" "HALO-${GITHUB_REF_NAME}-debug.apk" SHA256SUMS.txt --title "HALO ${GITHUB_REF_NAME} (Debug)" --notes "HALO Android notification studio development build. This APK uses the CI debug signing key."
