name: Release HALO Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halo-release-publishing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HALO source
        uses: actions/checkout@v4

      - name: Resolve APK version and release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android version ${RELEASE_TAG}"
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists: refusing to silently replace its signed APK."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        if: steps.version.outputs.publish == 'true'
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'"

      - name: Set up Gradle
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests and assemble installable debug APK
        if: steps.version.outputs.publish == 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify signature and generate checksum
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "HALO-${RELEASE_TAG}-debug.apk"
          sha256sum "HALO-${RELEASE_TAG}-debug.apk" > SHA256SUMS.txt

      - name: Keep CI build artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HALO-release-build
          path: |
            HALO-v*-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish installable APK to GitHub Releases
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "HALO-${RELEASE_TAG}-debug.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "HALO ${RELEASE_TAG} (Debug APK)" \
            --prerelease \
            --notes "HALO v0.20.11 adds a genuine AGSL impasto GPU shader for local photos and live user-consented app capture preview. Unlike previous fake systemwide brush overlays it paints captured pixels directly inside HALO, with a bounded latest-frame dispatcher and no system-wide window or touch obstruction. On Android 14+ choose a target app and view the preview from HALO in split screen; Android prohibits third-party shaders from changing other app surfaces without system privileges. Protected app capture may be blank. The former optional brush-overlay compositor remains in source but is no longer launched from the Painted Screen UI. Previous release notes: HALO v0.20.10 replaces the live painting TextureView compositor with an ordinary transparent View, removing the separate graphics buffer that could appear black or fail to redraw on Samsung One UI. The previous screen-copy layer was capable of blacking out the phone and blocking touches on Samsung One UI. The main UI view receives brush stamps, never an opaque captured-image backplate, and remains entirely touch-through. Its sole TYPE_APPLICATION_OVERLAY window has opacity capped at 0.48, FLAG_NOT_TOUCHABLE, and no separate secure SurfaceView, with a foreground Stop action. Old unsafe start intents remain blocked; new live sessions require explicit permission and an opt-in marker. CPU brush planning remains in a bounded latest-frame worker; blocked frames now pause the overlay and allow a cooled-down capture recovery instead of immediately stopping the service. Local photo painting is still available and the music, notification and video lighting modes are preserved. Android GPU instrumentation verifies no opaque painting backplate and safety gating. Android screen-sharing consent and OEM screenshot restrictions still apply; live Samsung device behaviour is not established by emulator tests. Debug signed APK."
