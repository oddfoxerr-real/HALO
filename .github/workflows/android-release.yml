name: Release HALO Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halo-release-publishing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HALO source
        uses: actions/checkout@v4

      - name: Resolve APK version and release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android version ${RELEASE_TAG}"
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists: refusing to silently replace its signed APK."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        if: steps.version.outputs.publish == 'true'
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'"

      - name: Set up Gradle
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests and assemble installable debug APK
        if: steps.version.outputs.publish == 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify signature and generate checksum
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "HALO-${RELEASE_TAG}-debug.apk"
          sha256sum "HALO-${RELEASE_TAG}-debug.apk" > SHA256SUMS.txt

      - name: Keep CI build artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HALO-release-build
          path: |
            HALO-v*-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish installable APK to GitHub Releases
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "HALO-${RELEASE_TAG}-debug.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "HALO ${RELEASE_TAG} (Debug APK)" \
            --prerelease \
            --notes "HALO v0.17.0: 24 original GPU effects including four stationary styles: Side Flames, Flat Edge Bars, Standing Waves and Corner Aura. CYN coexistence: keep animation visible while active media is playing even if Android FFT capture is temporarily unavailable, retry capture asynchronously instead of stopping the service, tolerate short media-session gaps, and support permitted foreground service restarts. If the player blocks capture, animation continues but is not described as beat synced. Artwork colors use dominant grouped hues for balanced primary and accent colors instead of individual saturated pixels. Existing 20 animation modes and saved choices are preserved. Physical Samsung/CYN verification remains necessary; secure/DRM video and overlay restrictions still apply. Debug prerelease."
