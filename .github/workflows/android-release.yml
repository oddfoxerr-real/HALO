name: Release HALO Android APK

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HALO source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve APK version and release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match Android version ${RELEASE_TAG}"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Run tests and assemble installable debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify signature and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "HALO-${RELEASE_TAG}-debug.apk"
          sha256sum "HALO-${RELEASE_TAG}-debug.apk" > SHA256SUMS.txt

      - name: Keep CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALO-release-build
          path: |
            HALO-v*-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish installable APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "HALO-${RELEASE_TAG}-debug.apk" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "HALO-${RELEASE_TAG}-debug.apk" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "HALO ${RELEASE_TAG} (Debug)" \
              --notes "Android notification character studio for Samsung Galaxy devices. Includes Material 3 UI, per-app character animations, app rules, full-phone preview, and experimental Pill Halo media lighting. This is a development APK signed using the CI debug key; installation on Galaxy A56 is not yet device-verified."
          fi
