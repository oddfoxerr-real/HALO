name: Release HALO Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halo-release-publishing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HALO source
        uses: actions/checkout@v4

      - name: Resolve APK version and release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android version ${RELEASE_TAG}"
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists: refusing to silently replace its signed APK."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        if: steps.version.outputs.publish == 'true'
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'"

      - name: Set up Gradle
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent HALO update signing certificate
        if: steps.version.outputs.publish == 'true'
        env:
          HALO_SIGNING_KEYSTORE_B64: ${{ secrets.HALO_SIGNING_KEYSTORE_B64 }}
          HALO_SIGNING_PASSWORD: ${{ secrets.HALO_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$HALO_SIGNING_KEYSTORE_B64" || -z "$HALO_SIGNING_PASSWORD" ]]; then
            echo "::error::Configure HALO_SIGNING_KEYSTORE_B64 and HALO_SIGNING_PASSWORD in repository Actions secrets before releasing a self-updating APK."
            exit 1
          fi
          printf '%s' "$HALO_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/halo-updates.jks"
          echo "HALO_UPDATE_KEYSTORE_PATH=$RUNNER_TEMP/halo-updates.jks" >> "$GITHUB_ENV"
          echo "HALO_UPDATE_STORE_PASSWORD=$HALO_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/halo-updates.jks" \
            -storepass "$HALO_SIGNING_PASSWORD" -alias halo

      - name: Run tests and assemble installable debug APK
        if: steps.version.outputs.publish == 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify signature and generate checksum
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "HALO-${RELEASE_TAG}-debug.apk"
          sha256sum "HALO-${RELEASE_TAG}-debug.apk" > SHA256SUMS.txt

      - name: Keep CI build artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HALO-release-build
          path: |
            HALO-v*-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish installable APK to GitHub Releases
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "HALO-${RELEASE_TAG}-debug.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "HALO ${RELEASE_TAG} (Debug APK)" \
            --prerelease \
            --notes "HALO v0.21.0 introduces an automatic background updater using WorkManager. HALO checks official GitHub releases approximately every six hours while unmetered network and battery conditions allow, stages APKs automatically, validates SHA-256 checksum, package identity, version and current signing certificate, then asks Android for a one-time installation confirmation when ready. Silent installation is not supported for ordinary sideloaded apps. APKs are now built using a persistent release signing certificate configured through encrypted GitHub Actions secrets. Original music, notifications, camera lighting, ambilight and painted brush strokes remain unchanged."
