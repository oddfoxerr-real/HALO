name: Release HALO Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halo-release-publishing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HALO source
        uses: actions/checkout@v4

      - name: Resolve APK version and release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android version ${RELEASE_TAG}"
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists: refusing to silently replace its signed APK."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        if: steps.version.outputs.publish == 'true'
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'"

      - name: Set up Gradle
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Load the permanent HALO signing identity
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          HALO_SIGNING_MATERIAL_B64: ${{ secrets.HALO_SIGNING_MATERIAL_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$HALO_SIGNING_MATERIAL_B64" ]]; then
            echo "::error::Missing HALO_SIGNING_MATERIAL_B64 repository secret. Refusing to publish APKs signed by temporary debug keys."
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          blob = base64.b64decode(os.environ["HALO_SIGNING_MATERIAL_B64"], validate=True)
          material = json.loads(blob)
          keystore = base64.b64decode(material["keystore_b64"], validate=True)
          password = material["password"]
          alias = material.get("alias", "halo-release")
          if len(keystore) < 1000 or len(password) < 32 or alias != "halo-release":
              raise SystemExit("Invalid HALO signing material")
          path = Path(os.environ["RUNNER_TEMP"]) / "halo-stable-release.p12"
          path.write_bytes(keystore)
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("HALO_RELEASE_KEYSTORE_PATH=" + str(path) + "\n")
              env.write("HALO_RELEASE_PASSWORD=" + password + "\n")
              env.write("HALO_RELEASE_ALIAS=" + alias + "\n")
          PY

      - name: Run tests and assemble signed release APK
        if: steps.version.outputs.publish == 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature and generate checksum
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "HALO-${RELEASE_TAG}-release.apk"
          sha256sum "HALO-${RELEASE_TAG}-release.apk" > SHA256SUMS.txt

      - name: Keep CI build artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HALO-release-build
          path: |
            HALO-v*-release.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish installable APK to GitHub Releases
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "HALO-${RELEASE_TAG}-release.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "HALO ${RELEASE_TAG} (Signed APK)" \
            --prerelease \
            --notes "HALO stable auto-updater: scheduled release checks every six hours, automatic SHA-256 and signature-verified downloads, and Android PackageInstaller self-update. Android approval is required only when the operating system enforces it. Every release uses a permanent private signing key from GitHub Actions secrets. Older debug-signed HALO installations require a one-time reinstall to migrate to stable signing. All 59 animations and both preview screens are preserved."
