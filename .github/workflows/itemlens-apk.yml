name: Build ItemLens APK

on:
  push:
    branches:
      - itemlens-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install supported Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack original ItemLens source
        run: |
          python3 -m pip install --user brotli pillow reportlab
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import brotli
          import io
          import tarfile
          contents = Path("itemlens-source.b64").read_text(encoding="ascii").strip()
          source_archive = brotli.decompress(base64.b64decode(contents, validate=True))
          with tarfile.open(fileobj=io.BytesIO(source_archive), mode="r:") as archive:
              archive.extractall(".")
          PY
          python3 generate_marker.py
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\nkotlin.code.style=official\n' > gradle.properties

      - name: Apply measurement and hand tracking integration
        run: |
          python3 itemlens-toolkit/apply.py
          mkdir -p app/src/main/assets
          curl -fSL --retry 3 --connect-timeout 20 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o app/src/main/assets/hand_landmarker.task
          test -s app/src/main/assets/hand_landmarker.task
          test -f app/src/main/res/drawable-nodpi/base_marker.png

      - name: Assemble ItemLens v0.2.0 debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ItemLens-0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
