name: Import HALO source and build APK
on:
  push:
    branches: [main]
    paths:
      - 'source/HALO-v0.4.1.tar.xz'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract native Android project
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf source/HALO-v0.4.1.tar.xz -C .
          test -f app/build.gradle.kts
          test -f app/src/main/java/dev/oddfoxerr/halo/MainActivity.kt
      - name: Commit extracted source to repository
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish HALO v0.4.1 native Android source"
            git push origin HEAD:main
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build HALO APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify signing
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload installable HALO APK
        uses: actions/upload-artifact@v4
        with:
          name: HALO-v0.4.1-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
