name: Build Slate Keyboard v0.3.1 APK
on:
  push:
    branches: [build/slate-keyboard-0.3.0]
  pull_request:
    branches: [build/slate-keyboard-0.3.0]
    paths:
      - 'slate-maintenance/**'
      - 'slate-v2/**'
      - 'slate-v3/**'
      - '.github/workflows/build-slate-v03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Slate v0.2 base project
        run: |
          set -euo pipefail
          base64 -d slate-v2/source.tar.xz.b64 > /tmp/slate.tar.xz
          echo '236c2e53909776778ee9268f0138f33add5bed8c2dbc02b619133cbc8f6266e2  /tmp/slate.tar.xz' | sha256sum -c -
          mkdir -p slate-project
          tar -xJf /tmp/slate.tar.xz -C slate-project
          test -f slate-project/app/src/main/assets/en_words.tsv
      - name: Apply v0.3 typing and image clipboard patch
        run: |
          set -euo pipefail
          cat slate-v3/part-*.txt | base64 -d > /tmp/slate-v3.patch.xz
          echo '119ac7751dfebff44de2943697c835181249b50dbdcbbce27ef64c6e31bde4f3  /tmp/slate-v3.patch.xz' | sha256sum -c -
          xz -dc /tmp/slate-v3.patch.xz > /tmp/slate-v3.patch
          cd slate-project
          patch --batch -p1 < /tmp/slate-v3.patch
          grep -q 'class ClipboardImageProvider' app/src/main/java/com/odd/slatekeyboard/ClipboardImageProvider.kt
          grep -q 'fun decodeGlide' app/src/main/java/com/odd/slatekeyboard/SuggestionEngine.kt
      - name: Apply clipboard race fix and regression tests
        run: |
          set -euo pipefail
          cp slate-project/app/src/main/java/com/odd/slatekeyboard/ClipboardStore.kt "$RUNNER_TEMP/slate-original-ClipboardStore.kt"
          (cd slate-project && patch --batch -p1 < ../slate-maintenance/clipboard-race.patch)
          mkdir -p slate-project/app/src/test/java/com/odd/slatekeyboard
          cp slate-maintenance/ClipboardStoreTest.kt slate-project/app/src/test/java/com/odd/slatekeyboard/
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('slate-project/app/build.gradle.kts')
          s = p.read_text()
          assert 'versionCode = 3' in s and 'versionName = "0.3.0"' in s
          s = s.replace('versionCode = 3', 'versionCode = 4').replace('versionName = "0.3.0"', 'versionName = "0.3.1"')
          s += '\nandroid { testOptions.unitTests.isIncludeAndroidResources = true }\n'
          s += 'dependencies {\n    testImplementation("junit:junit:4.13.2")\n    testImplementation("org.robolectric:robolectric:4.16.1")\n}\n'
          p.write_text(s)
          PYTHON
      - name: Reproduce regression, verify fix and package debug APK
        working-directory: slate-project
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash ../slate-maintenance/verify-clipboard.sh
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Slate-Clipboard-Regression
          path: |
            slate-project/maintenance-evidence/
            slate-project/app/build/reports/tests/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify and stage APK
        run: |
          set -euo pipefail
          apk=slate-project/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$apk" > /dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > /tmp/slate-badging.txt
          grep -q "package: name='com.odd.slatekeyboard' versionCode='4' versionName='0.3.1'" /tmp/slate-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          mkdir -p slate-dist
          cp "$apk" slate-dist/SlateKeyboard-v0.3.1-debug.apk
          (cd slate-dist && sha256sum SlateKeyboard-v0.3.1-debug.apk > SHA256SUMS.txt)
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SlateKeyboard-v0.3.1-debug
          path: slate-dist/
          if-no-files-found: error
          retention-days: 30
