name: Build HALO Android APK
on:
  push:
    branches: [main, 'prototype/**', 'feature/**', 'fix/**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

# Avoid consuming parallel runner slots for stale preview commits.
concurrency:
  group: halo-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test HALO
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signing and checksum
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HALO-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Android lint (external dependency outage does not block a debug APK)
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO-validation-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Explain incomplete lint validation
        if: steps.lint.outcome == 'failure'
        run: echo '::warning::Android lint did not complete successfully. Inspect Gradle logs and rerun after dependency repositories recover.'
